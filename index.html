<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDT — Collège Salinis</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #111;
    --card: #1a1a1a;
    --border: #252525;
    --accent: #ffe135;
    --cancel: #ff5252;
    --modif: #ff9800;
    --text: #ececec;
    --muted: #555;
    --green: #4ade80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }

  header {
    max-width: 980px;
    margin: 0 auto 0.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
  }

  h1 em { color: var(--accent); font-style: normal; }

  #meta {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: right;
    line-height: 1.6;
  }

  #status {
    max-width: 980px;
    margin: 0.75rem auto;
    font-size: 0.65rem;
    color: var(--muted);
    min-height: 1rem;
  }
  #status.err { color: var(--cancel); }
  #status.ok  { color: var(--green); }

  .week-nav {
    max-width: 980px;
    margin: 0 auto 1.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .week-nav button {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    padding: 0.45rem 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .week-nav button:hover { border-color: var(--accent); color: var(--accent); }

  #week-label {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .legend {
    max-width: 980px;
    margin: 0 auto 1.25rem;
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    font-size: 0.6rem;
    color: var(--muted);
  }
  .leg { display: flex; align-items: center; gap: 0.4rem; }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

  .grid {
    max-width: 980px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.6rem;
    align-items: start;
  }

  .day-col { display: flex; flex-direction: column; gap: 0.4rem; }

  .day-head {
    font-family: 'Unbounded', sans-serif;
    font-size: 0.55rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
  }
  .day-head.today { color: var(--accent); border-color: var(--accent); }

  .cours {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid #444;
    padding: 0.55rem 0.6rem;
    animation: pop 0.25s ease both;
  }

  .cours[data-mat="MATHEMATIQUES"]       { border-left-color: #60a5fa; }
  .cours[data-mat="FRANCAIS"]            { border-left-color: #f472b6; }
  .cours[data-mat="HISTOIRE-GEOGRAPHIE"] { border-left-color: #fb923c; }
  .cours[data-mat="ANGLAIS"]             { border-left-color: #34d399; }
  .cours[data-mat="ESPAGNOL"]            { border-left-color: #a78bfa; }
  .cours[data-mat="SCIENCES VIE"]        { border-left-color: #4ade80; }
  .cours[data-mat="PHYSIQUE-CHIMIE"]     { border-left-color: #22d3ee; }
  .cours[data-mat="TECHNOLOGIE"]         { border-left-color: #facc15; }
  .cours[data-mat="ARTS PLASTIQUES"]     { border-left-color: #f87171; }
  .cours[data-mat="EDUCATION MUSICALE"]  { border-left-color: #e879f9; }
  .cours[data-mat="EPS"]                 { border-left-color: #2dd4bf; }
  .cours[data-mat="LCA LATIN"]           { border-left-color: #d4a574; }
  .cours[data-mat="AE-AID"]             { border-left-color: #888; }
  .cours[data-mat="EXTERIEUR"]           { border-left-color: var(--cancel); }

  .cours.annule {
    opacity: 0.55;
    border-left-color: var(--cancel) !important;
    background: #1f1212;
  }
  .cours.modif  { border-left-color: var(--modif) !important; }
  .cours.vacances { border-left-color: var(--green) !important; background: #121f14; }

  .c-mat {
    font-size: 0.68rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .cours.annule .c-mat { text-decoration: line-through; color: var(--cancel); }
  .cours.modif  .c-mat { color: var(--modif); }

  .c-heure { font-size: 0.58rem; color: var(--muted); margin-top: 0.15rem; }
  .c-salle { font-size: 0.55rem; color: var(--muted); margin-top: 0.1rem; }
  .c-prof  { font-size: 0.55rem; color: var(--muted); margin-top: 0.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .c-badge {
    display: inline-block;
    font-size: 0.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0.1rem 0.3rem;
    margin-top: 0.25rem;
  }
  .badge-annule { background: var(--cancel); color: #000; }
  .badge-modif  { background: var(--modif);  color: #000; }
  .badge-vac    { background: var(--green);  color: #000; }

  .empty { font-size: 0.6rem; color: var(--border); padding: 0.75rem 0; text-align: center; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  .mobile-tabs {
    display: none;
    max-width: 980px;
    margin: 0 auto 1rem;
    gap: 0.3rem;
    flex-wrap: wrap;
  }
  .mobile-tabs button {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    padding: 0.4rem 0.3rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
    min-width: 50px;
  }
  .mobile-tabs button.active { border-color: var(--accent); color: var(--accent); }
  .mobile-tabs button.today-tab { border-color: var(--green); }

  @media (max-width: 640px) {
    .mobile-tabs { display: flex; }
    .grid { grid-template-columns: 1fr; }
    .day-col { display: none; }
    .day-col.active { display: flex; }
  }
</style>
</head>
<body>

<header>
  <h1>E<em>D</em>T</h1>
  <div id="meta">chargement…</div>
</header>

<div id="status">→ récupération du calendrier…</div>

<div class="week-nav">
  <button onclick="changeWeek(-1)">← préc.</button>
  <span id="week-label"></span>
  <button onclick="changeWeek(1)">suiv. →</button>
</div>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:var(--accent)"></div>aujourd'hui</div>
  <div class="leg"><div class="leg-dot" style="background:var(--cancel)"></div>annulé</div>
  <div class="leg"><div class="leg-dot" style="background:var(--modif)"></div>modifié</div>
  <div class="leg"><div class="leg-dot" style="background:var(--green)"></div>vacances / férié</div>
</div>

<div class="mobile-tabs" id="mobile-tabs"></div>
<div class="grid" id="grid"></div>

<script>
// ══════════════════════════════════════════════
// 🔧 REMPLACE PAR TON VRAI LIEN ICS PRONOTE
const ICS_URL = "https://lien/";
// ══════════════════════════════════════════════

const PROXY   = "https://api.allorigins.win/raw?url=";
const JOURS   = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const JOURS_S = ['Lun','Mar','Mer','Jeu','Ven'];

let allEvents = [], weekOffset = 0, activeMobDay = 0;

function getMonday(d) {
  const dt = new Date(d); dt.setHours(0,0,0,0);
  const day = dt.getDay();
  dt.setDate(dt.getDate() - (day === 0 ? 6 : day - 1));
  return dt;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtH(d) { return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDate(d) { return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}); }
function weekNum(d) {
  const dt = new Date(d); dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()+3-(dt.getDay()+6)%7);
  const w1 = new Date(dt.getFullYear(),0,4);
  return 1+Math.round(((dt-w1)/864e5-3+(w1.getDay()+6)%7)/7);
}

function parseICSDate(raw) {
  raw = raw.trim();
  if (raw.includes('VALUE=DATE')) {
    const s = raw.split(':')[1];
    return new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T00:00:00');
  }
  const s = raw.replace(/.*:/,'').replace('Z','');
  const iso = `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:00${raw.endsWith('Z')?'Z':''}`;
  return new Date(iso);
}

function parseICS(raw) {
  const unfolded = raw.replace(/\r?\n[ \t]/g, '');
  const lines = unfolded.split(/\r?\n/);
  const events = []; let ev = null;
  for (const line of lines) {
    if (line === 'BEGIN:VEVENT') { ev = {}; continue; }
    if (line === 'END:VEVENT')   { if (ev) events.push(ev); ev = null; continue; }
    if (!ev) continue;
    const sep = line.indexOf(':'); if (sep < 0) continue;
    const key = line.slice(0,sep).split(';')[0].toUpperCase();
    const val = line.slice(sep+1).trim();
    if (key==='SUMMARY')     ev.summary    = val.replace(/\\,/g,',').replace(/\\n/g,'');
    if (key==='DTSTART')     ev.dtstart    = parseICSDate(line.slice(sep+1));
    if (key==='DTEND')       ev.dtend      = parseICSDate(line.slice(sep+1));
    if (key==='LOCATION')    ev.location   = val.replace(/\\,/g,',');
    if (key==='CATEGORIES')  ev.categories = val;
    if (key==='STATUS')      ev.status     = val;
  }
  return events;
}

function parseSummary(s) {
  const parts = s.split(' - ');
  return { mat: (parts[0]||s).trim(), prof: (parts[1]||'').trim() };
}

function matKey(mat) {
  if (mat.startsWith('MATHEMATIQUES'))      return 'MATHEMATIQUES';
  if (mat.startsWith('FRANCAIS'))           return 'FRANCAIS';
  if (mat.startsWith('HISTOIRE'))           return 'HISTOIRE-GEOGRAPHIE';
  if (mat.startsWith('ANGLAIS'))            return 'ANGLAIS';
  if (mat.startsWith('ESPAGNOL'))           return 'ESPAGNOL';
  if (mat.startsWith('SCIENCES VIE'))       return 'SCIENCES VIE';
  if (mat.startsWith('PHYSIQUE'))           return 'PHYSIQUE-CHIMIE';
  if (mat.startsWith('TECHNOLOGIE'))        return 'TECHNOLOGIE';
  if (mat.startsWith('ARTS PLASTIQUES'))    return 'ARTS PLASTIQUES';
  if (mat.startsWith('EDUCATION MUSICALE')) return 'EDUCATION MUSICALE';
  if (mat.startsWith('EPS'))                return 'EPS';
  if (mat.startsWith('LCA'))               return 'LCA LATIN';
  if (mat.startsWith('AE-'))               return 'AE-AID';
  if (mat.startsWith('EXTERIEUR'))         return 'EXTERIEUR';
  return '';
}

const isAnnule  = ev => (ev.categories||'').toLowerCase().includes('annul') || ev.status==='CANCELLED';
const isModif   = ev => !isAnnule(ev) && (ev.categories||'').toLowerCase().includes('modif');
const isVacances= ev => (ev.categories||'').toLowerCase().includes('feri') ||
                        (ev.summary||'').toLowerCase().includes('vacances') ||
                        (ev.summary||'').toLowerCase().includes('férié');

function getTodayIdx() {
  const today = new Date(); today.setHours(0,0,0,0);
  const monday = addDays(getMonday(new Date()), weekOffset*7);
  for (let i=0;i<5;i++) { const d=addDays(monday,i); d.setHours(0,0,0,0); if(d.getTime()===today.getTime()) return i; }
  return -1;
}

function render() {
  const monday = addDays(getMonday(new Date()), weekOffset*7);
  const friday = addDays(monday, 4);
  const today  = new Date(); today.setHours(0,0,0,0);

  document.getElementById('week-label').textContent =
    `sem. ${weekNum(monday)} · ${fmtDate(monday)} — ${fmtDate(friday)}`;

  const grid = document.getElementById('grid');
  const tabs = document.getElementById('mobile-tabs');
  grid.innerHTML = tabs.innerHTML = '';

  for (let i=0;i<5;i++) {
    const dayStart = addDays(monday,i); dayStart.setHours(0,0,0,0);
    const dayEnd   = addDays(dayStart,1);
    const isToday  = dayStart.getTime()===today.getTime();

    const dayEvs = allEvents.filter(ev => {
      if (!ev.dtstart) return false;
      if (isVacances(ev) && ev.dtend) {
        const s=new Date(ev.dtstart); s.setHours(0,0,0,0);
        const e=new Date(ev.dtend);   e.setHours(0,0,0,0);
        return dayStart>=s && dayStart<e;
      }
      const evDay=new Date(ev.dtstart); evDay.setHours(0,0,0,0);
      return evDay.getTime()===dayStart.getTime();
    }).sort((a,b)=>a.dtstart-b.dtstart);

    const col = document.createElement('div');
    col.className = 'day-col'+(i===activeMobDay?' active':'');

    const head = document.createElement('div');
    head.className = 'day-head'+(isToday?' today':'');
    head.textContent = `${JOURS[i]} ${dayStart.getDate()}`;
    col.appendChild(head);

    if (!dayEvs.length) {
      const e=document.createElement('div'); e.className='empty'; e.textContent='—'; col.appendChild(e);
    } else {
      dayEvs.forEach((ev,idx) => {
        const annule=isAnnule(ev), modif=isModif(ev), vac=isVacances(ev);
        const {mat,prof}=parseSummary(ev.summary||'');

        const div=document.createElement('div');
        div.className='cours'+(annule?' annule':'')+(modif?' modif':'')+(vac?' vacances':'');
        div.dataset.mat=matKey(mat);
        div.style.animationDelay=`${idx*0.04}s`;

        const cmat=document.createElement('div'); cmat.className='c-mat'; cmat.textContent=mat; div.appendChild(cmat);

        if (!vac && ev.dtstart && ev.dtend) {
          const h=document.createElement('div'); h.className='c-heure';
          h.textContent=`${fmtH(ev.dtstart)} → ${fmtH(ev.dtend)}`; div.appendChild(h);
        }
        if (ev.location) {
          const s=document.createElement('div'); s.className='c-salle'; s.textContent=ev.location; div.appendChild(s);
        }
        if (prof && !vac) {
          const p=document.createElement('div'); p.className='c-prof'; p.textContent=prof; div.appendChild(p);
        }
        if (annule||modif||vac) {
          const b=document.createElement('span');
          b.className='c-badge '+(annule?'badge-annule':modif?'badge-modif':'badge-vac');
          b.textContent=annule?'annulé':modif?'modifié':(ev.summary||'vacances');
          div.appendChild(b);
        }
        col.appendChild(div);
      });
    }
    grid.appendChild(col);

    const btn=document.createElement('button');
    btn.textContent=`${JOURS_S[i]} ${dayStart.getDate()}`;
    btn.className=(i===activeMobDay?'active':'')+(isToday?' today-tab':'');
    btn.onclick=()=>{
      activeMobDay=i;
      document.querySelectorAll('.day-col').forEach((c,j)=>c.classList.toggle('active',j===i));
      document.querySelectorAll('.mobile-tabs button').forEach((b,j)=>{
        b.className=(j===i?'active':'')+(j===getTodayIdx()?' today-tab':'');
      });
    };
    tabs.appendChild(btn);
  }

  // Focus sur aujourd'hui sur mobile
  const ti=getTodayIdx();
  if (ti>=0) {
    activeMobDay=ti;
    document.querySelectorAll('.day-col').forEach((c,j)=>c.classList.toggle('active',j===ti));
    document.querySelectorAll('.mobile-tabs button').forEach((b,j)=>{
      b.className=(j===ti?'active':'')+(j===ti?' today-tab':'');
    });
  }
}

function changeWeek(dir) { weekOffset+=dir; activeMobDay=0; render(); }

async function fetchICS() {
  const st=document.getElementById('status');
  try {
    const res=await fetch(PROXY+encodeURIComponent(ICS_URL));
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text=await res.text();

    const calName=text.match(/X-WR-CALNAME[^:]*:([^\r\n]+)/);
    if (calName) {
      const parts=calName[1].split(' - ');
      const eleve=parts[1]?parts[1].trim():'';
      const etab =parts[2]?parts[2].trim():'';
      document.getElementById('meta').innerHTML=`${eleve}<br><span style="color:var(--muted)">${etab}</span>`;
    }

    allEvents=parseICS(text);
    const nbCours=allEvents.filter(e=>!isVacances(e)).length;
    st.textContent=`✓ ${nbCours} cours chargés`;
    st.className='ok';
    render();
  } catch(e) {
    st.textContent=`✗ Erreur : ${e.message} — vérifie le lien ICS`;
    st.className='err';
    console.error(e);
  }
}

fetchICS();
</script>
</body>
</html>
