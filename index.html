<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDT</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #181818;
    --border: #2a2a2a;
    --accent: #c8f135;
    --accent2: #3df5c1;
    --text: #f0f0f0;
    --muted: #666;
    --cancel: #ff4d4d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  header {
    max-width: 900px;
    margin: 0 auto 3rem;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.5rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }

  h1 span { color: var(--accent); }

  #semaine {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .nav-week {
    max-width: 900px;
    margin: 0 auto 2rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .nav-week button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .nav-week button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .nav-week span {
    flex: 1;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.75rem;
  }

  .day-col {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .day-header {
    font-family: 'Syne', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--muted);
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.25rem;
  }

  .day-header.today { color: var(--accent); border-bottom-color: var(--accent); }

  .cours {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    padding: 0.6rem 0.75rem;
    position: relative;
    animation: fadeIn 0.3s ease forwards;
    opacity: 0;
  }

  .cours.annule {
    border-left-color: var(--cancel);
    opacity: 0.6;
  }

  .cours.annule .cours-nom {
    text-decoration: line-through;
    color: var(--cancel);
  }

  .cours-nom {
    font-size: 0.75rem;
    font-weight: 500;
    margin-bottom: 0.2rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cours-heure {
    font-size: 0.65rem;
    color: var(--muted);
  }

  .cours-lieu {
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 0.1rem;
  }

  .tag-annule {
    font-size: 0.55rem;
    background: var(--cancel);
    color: #000;
    padding: 0.1rem 0.3rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-block;
    margin-top: 0.2rem;
  }

  .empty {
    font-size: 0.7rem;
    color: var(--border);
    text-align: center;
    padding: 1rem 0;
  }

  #status {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    font-size: 0.7rem;
    color: var(--muted);
  }

  #status.error { color: var(--cancel); }

  .loader {
    max-width: 900px;
    margin: 2rem auto;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @media (max-width: 600px) {
    .grid {
      grid-template-columns: 1fr;
    }
    .day-col { display: none; }
    .day-col.active { display: flex; }
    .nav-week { justify-content: space-between; }
  }

  .mobile-day-nav {
    display: none;
    max-width: 900px;
    margin: 0 auto 1rem;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  @media (max-width: 600px) {
    .mobile-day-nav { display: flex; }
  }

  .mobile-day-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    padding: 0.4rem 0.6rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.15s;
  }

  .mobile-day-nav button.active {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <h1>EDT<span>.</span></h1>
  <div id="semaine">chargement...</div>
</header>

<div id="status">→ récupération du calendrier...</div>

<div class="nav-week">
  <button onclick="changeWeek(-1)">← préc.</button>
  <span id="week-label"></span>
  <button onclick="changeWeek(1)">suiv. →</button>
</div>

<div class="mobile-day-nav" id="mobile-day-nav"></div>

<div class="grid" id="grid">
  <div class="loader">chargement...</div>
</div>

<script>
// 🔧 REMPLACE CE LIEN PAR TON LIEN ICS PRONOTE
const ICS_URL = "https://0320562m.index-education.net/pronote/ical/mesinformations.ics?icalsecurise=A650360972DFC28B16599B103A5F70AB76CB9660ED992BAE6A5D3C71CC1C946E0D311DB3D359208D41FF26B37A44C77D&version=2025.2.11&param=900A75DF9ED8C62E212781A9E4DCC937";

// Proxy CORS public (nécessaire pour fetch depuis GitHub Pages)
const PROXY = "https://api.allorigins.win/raw?url=";

const JOURS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
const JOURS_SHORT = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'];

let currentWeekOffset = 0;
let allEvents = [];
let activeMobileDay = 0;

function getMonday(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function parseICS(text) {
  const events = [];
  const blocks = text.split('BEGIN:VEVENT');
  for (let i = 1; i < blocks.length; i++) {
    const block = blocks[i];
    const get = (key) => {
      const regex = new RegExp(`${key}[^:]*:([^\\r\\n]+)`);
      const m = block.match(regex);
      return m ? m[1].trim() : '';
    };
    const parseDate = (str) => {
      if (!str) return null;
      // Format: 20240101T080000Z ou 20240101T080000
      const s = str.replace('Z', '');
      const y = s.substr(0,4), mo = s.substr(4,2), d = s.substr(6,2);
      const h = s.substr(9,2)||'00', mi = s.substr(11,2)||'00';
      return new Date(`${y}-${mo}-${d}T${h}:${mi}:00`);
    };

    const summary = get('SUMMARY');
    const dtstart = parseDate(get('DTSTART'));
    const dtend = parseDate(get('DTEND'));
    const location = get('LOCATION');
    const description = get('DESCRIPTION');
    const status = get('STATUS');

    if (summary && dtstart) {
      events.push({ summary, dtstart, dtend, location, description, status });
    }
  }
  return events;
}

function formatHeure(date) {
  if (!date) return '';
  return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function isAnnule(event) {
  return event.status === 'CANCELLED' ||
    event.summary.toLowerCase().includes('annul') ||
    event.description.toLowerCase().includes('annul');
}

function renderWeek() {
  const monday = getMonday(new Date());
  monday.setDate(monday.getDate() + currentWeekOffset * 7);

  const friday = new Date(monday);
  friday.setDate(monday.getDate() + 4);

  const fmt = (d) => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  document.getElementById('week-label').textContent = `${fmt(monday)} — ${fmt(friday)}`;
  document.getElementById('semaine').textContent = `Sem. ${getWeekNumber(monday)}`;

  const today = new Date();
  today.setHours(0,0,0,0);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const mobileNav = document.getElementById('mobile-day-nav');
  mobileNav.innerHTML = '';

  for (let i = 0; i < 5; i++) {
    const dayDate = new Date(monday);
    dayDate.setDate(monday.getDate() + i);
    const nextDay = new Date(dayDate);
    nextDay.setDate(dayDate.getDate() + 1);

    const isToday = dayDate.getTime() === today.getTime();

    // Filtrer les événements du jour
    const dayEvents = allEvents
      .filter(e => e.dtstart >= dayDate && e.dtstart < nextDay)
      .sort((a, b) => a.dtstart - b.dtstart);

    const col = document.createElement('div');
    col.className = 'day-col' + (i === activeMobileDay ? ' active' : '');

    const header = document.createElement('div');
    header.className = 'day-header' + (isToday ? ' today' : '');
    header.textContent = `${JOURS[i]} ${dayDate.getDate()}`;
    col.appendChild(header);

    if (dayEvents.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '—';
      col.appendChild(empty);
    } else {
      dayEvents.forEach((ev, idx) => {
        const annule = isAnnule(ev);
        const div = document.createElement('div');
        div.className = 'cours' + (annule ? ' annule' : '');
        div.style.animationDelay = `${idx * 0.05}s`;

        const nom = document.createElement('div');
        nom.className = 'cours-nom';
        nom.textContent = ev.summary;

        const heure = document.createElement('div');
        heure.className = 'cours-heure';
        heure.textContent = `${formatHeure(ev.dtstart)} → ${formatHeure(ev.dtend)}`;

        div.appendChild(nom);
        div.appendChild(heure);

        if (ev.location) {
          const lieu = document.createElement('div');
          lieu.className = 'cours-lieu';
          lieu.textContent = ev.location;
          div.appendChild(lieu);
        }

        if (annule) {
          const tag = document.createElement('span');
          tag.className = 'tag-annule';
          tag.textContent = 'annulé';
          div.appendChild(tag);
        }

        col.appendChild(div);
      });
    }

    grid.appendChild(col);

    // Mobile nav
    const btn = document.createElement('button');
    btn.textContent = `${JOURS_SHORT[i]} ${dayDate.getDate()}`;
    if (i === activeMobileDay) btn.className = 'active';
    if (isToday) btn.style.borderColor = 'var(--accent2)';
    btn.onclick = () => {
      activeMobileDay = i;
      document.querySelectorAll('.day-col').forEach((c, j) => {
        c.classList.toggle('active', j === i);
      });
      document.querySelectorAll('.mobile-day-nav button').forEach((b, j) => {
        b.classList.toggle('active', j === i);
      });
    };
    mobileNav.appendChild(btn);
  }
}

function changeWeek(dir) {
  currentWeekOffset += dir;
  renderWeek();
}

function getWeekNumber(d) {
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

async function fetchICS() {
  const status = document.getElementById('status');
  try {
    const url = PROXY + encodeURIComponent(ICS_URL);
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    allEvents = parseICS(text);
    status.textContent = `✓ ${allEvents.length} événements chargés`;
    status.className = '';
    renderWeek();
  } catch (e) {
    status.textContent = `✗ Erreur : ${e.message} — vérifie le lien ICS dans index.html`;
    status.className = 'error';
    document.getElementById('grid').innerHTML = '';
  }
}

fetchICS();
</script>
</body>
</html>
